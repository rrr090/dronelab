<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Flight Viewer</title>
<style>
  :root {
    --bg: #0d1015; --panel: #141922; --panel-2: #1a202b; --line: #262e3b;
    --text: #e6e9ef; --muted: #8b95a7; --accent: #5aa9ff;
    --ok: #3ecf8e; --bad: #ff5d5d; --warn: #f5b84b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }
  #app { display: grid; grid-template-columns: 290px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 14px; }
  aside h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .section { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin: 16px 0 6px; }
  .scn { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    border-radius: 8px; padding: 7px 9px; cursor: pointer; margin-bottom: 2px; }
  .scn:hover { background: var(--panel-2); }
  .scn.active { background: var(--panel-2); border-color: var(--line); }
  .scn .name { font-weight: 600; }
  .scn .desc { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #0f131a; border: 1px solid var(--line); white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .run { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 7px; padding: 5px 8px; cursor: pointer; text-align: left; }
  .run:hover { background: var(--panel-2); }
  .run.sel { border-color: var(--accent); background: var(--panel-2); }
  .run .lbl { flex: 1; }
  .run .st { font-size: 12px; font-variant-numeric: tabular-nums; }
  .st.ok { color: var(--ok); } .st.bad { color: var(--bad); } .st.fly { color: var(--muted); }
  .help { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
  kbd { background: #0f131a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }

  main { position: relative; display: grid; grid-template-rows: 1fr 140px; min-width: 0; min-height: 0; }
  #view { position: relative; min-height: 0; overflow: hidden; }
  #view canvas { display: block; }
  .overlay { position: absolute; display: flex; gap: 6px; align-items: center; }
  #cams { top: 12px; right: 12px; }
  #title { top: 12px; left: 14px; pointer-events: none; flex-direction: column; align-items: flex-start; gap: 0; }
  #title .big { font-size: 18px; font-weight: 600; }
  #title .small { color: var(--muted); }
  .btn { background: rgba(20,25,34,.85); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  .btn:hover { border-color: #3a4456; }
  .btn.on { border-color: var(--accent); color: #cfe5ff; }
  #bar { left: 12px; right: 12px; bottom: 12px; background: rgba(20,25,34,.88); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; flex-wrap: wrap; }
  #play { width: 34px; text-align: center; }
  #scrub { flex: 1; min-width: 140px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; color: var(--muted); }
  select { background: #0f131a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px; font: inherit; }
  .tog { display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; user-select: none; }
  #chartWrap { position: relative; border-top: 1px solid var(--line); background: var(--panel); }
  #chart { width: 100%; height: 100%; display: block; cursor: col-resize; }
  #err { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr 210px; }
    aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    main { grid-template-rows: 1fr 100px; }
    #cams { top: auto; bottom: 64px; right: 12px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>Drone Flight Viewer</h1>
    <div class="meta" id="meta"></div>
    <div class="section">Scenarios</div>
    <div id="scenarios"></div>
    <div class="section">Runs in this scenario</div>
    <div id="runs"></div>
    <div class="help">
      <kbd>Space</kbd> play/pause &nbsp; <kbd>←</kbd><kbd>→</kbd> step<br>
      <kbd>R</kbd> restart &nbsp; <kbd>1</kbd>–<kbd>4</kbd> camera<br>
      Drag to orbit, scroll to zoom, right-drag to pan.<br>
      Orange plumes = motor thrust. Cyan arrow = wind / gust force.
    </div>
  </aside>
  <main>
    <div id="view">
      <div class="overlay" id="title"><span class="big" id="scnName"></span><span class="small" id="scnDesc"></span></div>
      <div class="overlay" id="cams">
        <button class="btn" data-cam="oblique">1 Oblique</button>
        <button class="btn" data-cam="front">2 Front</button>
        <button class="btn" data-cam="top">3 Top</button>
        <button class="btn" data-cam="follow">4 Follow</button>
      </div>
      <div class="overlay" id="bar">
        <button class="btn" id="play" title="Play / pause">▶</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
        <span id="time">0.00 s</span>
        <select id="speed" title="Playback speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
        <label class="tog"><input type="checkbox" id="tTrail" checked>trails</label>
        <label class="tog"><input type="checkbox" id="tForce" checked>forces</label>
        <label class="tog"><input type="checkbox" id="tLoop">loop</label>
      </div>
      <div id="err"></div>
    </div>
    <div id="chartWrap"><canvas id="chart"></canvas></div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = /*__DATA__*/null;

const POLICY_COLORS = ['#5aa9ff', '#f5b84b', '#c78bff', '#3ecf8e', '#ff8fb1'];
const CRASH = '#ff5d5d';
const LANE = 1.3;          // spacing between lanes [m]
const SCALE = 1.7;         // drone drawn this much larger than real, for visibility
const M = DATA.meta;
const policyColor = Object.fromEntries(M.policies.map((p, i) => [p, POLICY_COLORS[i % POLICY_COLORS.length]]));

// ------------------------------------------------------------------ scene
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1015');
scene.fog = new THREE.Fog('#0d1015', 14, 40);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight('#c4d6ff', '#1a1e26', 0.9));
const sun = new THREE.DirectionalLight('#ffffff', 1.4);
sun.position.set(4, 8, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 30 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: '#141922', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(60, 120, '#2a3342', '#1b212b');
grid.position.y = 0.001;
scene.add(grid);

// ------------------------------------------------------------------ helpers
function textSprite(text, color = '#cfd6e2') {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = '600 44px system-ui, sans-serif';
  c.width = Math.ceil(ctx.measureText(text).width) + 24; c.height = 64;
  ctx.font = '600 44px system-ui, sans-serif';
  ctx.fillStyle = color; ctx.textBaseline = 'middle';
  ctx.fillText(text, 12, 34);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(0.17 * c.width / c.height, 0.17, 1);
  s.center.set(0, 0.5);
  return s;
}

function makeDrone(color) {
  const g = new THREE.Group();
  const S = M.arm * SCALE;
  const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.35, roughness: 0.45 });
  const dark = new THREE.MeshStandardMaterial({ color: '#2a3039', metalness: 0.4, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(S * 0.85, S * 0.3, S * 0.85), bodyMat);
  body.castShadow = true; g.add(body);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(S * 0.18, S * 0.1, S * 0.18), dark);
  nose.position.set(0, S * 0.2, 0); g.add(nose);
  for (const a of [Math.PI / 4, -Math.PI / 4]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(2 * S * Math.SQRT2, S * 0.07, S * 0.09), dark);
    arm.rotation.y = a; arm.castShadow = true; g.add(arm);
  }
  const rotors = [];
  const discMat = new THREE.MeshBasicMaterial({ color: '#9fb3cc', transparent: true, opacity: 0.18, depthWrite: false });
  const plumeGeo = new THREE.ConeGeometry(S * 0.16, 1, 16, 1, true);
  plumeGeo.rotateX(Math.PI); plumeGeo.translate(0, -0.5, 0);   // base at rotor, tip pointing down
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const r = new THREE.Group();
    r.position.set(sx * S, S * 0.1, sz * S);
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(S * 0.1, S * 0.1, S * 0.14, 12), dark);
    r.add(motor);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(S * 0.55, S * 0.55, 0.003, 28), discMat);
    disc.position.y = S * 0.09; r.add(disc);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(S * 1.05, 0.006, S * 0.1), dark);
    blade.position.y = S * 0.09; r.add(blade);
    const plume = new THREE.Mesh(plumeGeo, new THREE.MeshBasicMaterial({
      color: '#ffb05a', transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending }));
    plume.position.y = -S * 0.08; r.add(plume);
    g.add(r);
    // Sim motor 0 is at -x, motor 1 at +x (positive torque = t1 - t0).
    rotors.push({ blade, plume, motor: sx < 0 ? 0 : 1, dir: sx * sz });
  }
  return { group: g, bodyMat, baseColor: new THREE.Color(color), rotors };
}

// ------------------------------------------------------------------ world (rebuilt per scenario)
let world = null, lanes = [], sc = null, maxN = 1, windPts = null;
const state = { t: 0, playing: true, speed: 1, sel: 0, cam: 'oblique' };

function disposeTree(o) {
  o.traverse(n => {
    n.geometry?.dispose();
    const m = n.material; if (m) (Array.isArray(m) ? m : [m]).forEach(x => { x.map?.dispose(); x.dispose(); });
  });
}

function laneZ(i) { return (i - (lanes.length - 1) / 2) * LANE; }

function loadScenario(idx) {
  if (world) { scene.remove(world); disposeTree(world); }
  sc = DATA.scenarios[idx];
  world = new THREE.Group(); scene.add(world);
  lanes = sc.runs.map(r => ({ run: r }));
  maxN = Math.max(...sc.runs.map(r => r.x.length));
  const zSpan = Math.max(1, lanes.length) * LANE;
  const B = M.bounds;

  // flight volume (termination bounds)
  const box = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(2 * B.x, B.zmax - B.zmin, zSpan)),
    new THREE.LineBasicMaterial({ color: '#3a4454', transparent: true, opacity: 0.55 }));
  box.position.set(0, (B.zmax + B.zmin) / 2, 0);
  world.add(box);

  lanes.forEach((L, i) => {
    const z = laneZ(i), r = L.run, col = policyColor[r.policy];
    // target marker + pole
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.007, 8, 40),
      new THREE.MeshBasicMaterial({ color: '#3ecf8e', transparent: true, opacity: 0.8 }));
    ring.position.set(0, M.target_z, z); world.add(ring);
    const pole = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(0, 0, z), new THREE.Vector3(0, M.target_z - 0.11, z)]),
      new THREE.LineDashedMaterial({ color: '#3ecf8e', dashSize: 0.05, gapSize: 0.05, transparent: true, opacity: 0.35 }));
    pole.computeLineDistances(); world.add(pole);
    // lane label
    const lab = textSprite(`${r.policy} · seed ${r.seed}`, col);
    lab.position.set(B.x + 0.08, 0.1, z); world.add(lab);
    // trail
    const pos = new Float32Array(r.x.length * 3);
    for (let k = 0; k < r.x.length; k++) { pos[3 * k] = r.x[k]; pos[3 * k + 1] = r.z[k]; pos[3 * k + 2] = z; }
    const tg = new THREE.BufferGeometry(); tg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    L.trailMat = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.55 });
    L.trail = new THREE.Line(tg, L.trailMat); world.add(L.trail);
    // drone
    L.drone = makeDrone(col); world.add(L.drone.group);
    // external force arrow
    L.arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.3, '#5fd4ff', 0.07, 0.05);
    world.add(L.arrow);
    // impulse flash
    L.flash = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16),
      new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false }));
    world.add(L.flash);
  });

  // wind particles, only when the scenario has wind or gusts
  windPts = null;
  if (sc.has_wind) {
    const n = 900, p = new Float32Array(n * 3);
    for (let k = 0; k < n; k++) {
      p[3 * k] = (Math.random() * 2 - 1) * (B.x + 1);
      p[3 * k + 1] = Math.random() * (B.zmax + 0.3);
      p[3 * k + 2] = (Math.random() - 0.5) * (zSpan + 1);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const dotC = document.createElement('canvas'); dotC.width = dotC.height = 32;
    const dctx = dotC.getContext('2d'), grd = dctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    dctx.fillStyle = grd; dctx.fillRect(0, 0, 32, 32);
    windPts = new THREE.Points(g, new THREE.PointsMaterial({ color: '#8fd8ff', size: 0.03, map: new THREE.CanvasTexture(dotC),
      transparent: true, opacity: 0.6, depthWrite: false }));
    world.add(windPts);
  }

  state.t = 0; state.sel = Math.min(state.sel, lanes.length - 1); state.playing = true;
  document.getElementById('scnName').textContent = sc.name;
  document.getElementById('scnDesc').textContent = sc.description;
  document.querySelectorAll('.scn').forEach((b, i) => b.classList.toggle('active', i === idx));
  buildRunList();
  setCamera(state.cam, true);
  drawChartBase();
  try { history.replaceState(null, '', '#' + sc.name); } catch (e) {}
}

// ------------------------------------------------------------------ cameras
function setCamera(kind, snap) {
  state.cam = kind;
  document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === kind));
  const zSpan = Math.max(1, lanes.length) * LANE;
  const tgt = new THREE.Vector3(0, M.target_z, 0);
  if (kind === 'oblique') camera.position.set(4.2, 3.4, zSpan / 2 + 4.8);
  else if (kind === 'front') camera.position.set(0, M.target_z + 0.2, zSpan / 2 + 5.5);
  else if (kind === 'top') camera.position.set(0.01, 6 + zSpan * 0.6, 0.6);
  else if (kind === 'follow') { const d = lanes[state.sel].drone.group.position; tgt.copy(d); camera.position.set(d.x + 1.1, d.y + 0.6, d.z + 1.9); }
  if (kind !== 'follow' || snap) controls.target.copy(tgt);
  controls.update();
}
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCamera(b.dataset.cam, true));

// ------------------------------------------------------------------ sidebar
function pct(v) { return Math.round(v * 100) + '%'; }
function buildScenarioList() {
  const el = document.getElementById('scenarios');
  DATA.scenarios.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'scn';
    const chips = M.policies.map(p => {
      const m = s.summary[p]; if (!m) return '';
      return `<span class="chip"><span class="dot" style="background:${policyColor[p]}"></span>${p} ${pct(m.success_rate)} ok` +
        (m.crash_rate > 0 ? ` · <span style="color:${CRASH}">${pct(m.crash_rate)} crash</span>` : '') + `</span>`;
    }).join('');
    b.innerHTML = `<div class="name">${s.name}</div><div class="desc">${s.description}</div><div class="chips">${chips}</div>`;
    b.onclick = () => loadScenario(i);
    el.appendChild(b);
  });
}
function buildRunList() {
  const el = document.getElementById('runs'); el.innerHTML = '';
  lanes.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'run';
    b.innerHTML = `<span class="dot" style="background:${policyColor[L.run.policy]}"></span>` +
      `<span class="lbl">${L.run.policy} · seed ${L.run.seed}</span><span class="st fly"></span>`;
    b.onclick = () => { state.sel = i; if (state.cam === 'follow') setCamera('follow', true); refreshSel(); };
    L.row = b; L.stEl = b.querySelector('.st');
    el.appendChild(b);
  });
  refreshSel();
}
function refreshSel() {
  lanes.forEach((L, i) => {
    L.row.classList.toggle('sel', i === state.sel);
    L.trailMat.opacity = i === state.sel ? 0.95 : 0.4;
  });
}

// ------------------------------------------------------------------ per-frame update
const tmp = new THREE.Vector3();
function updateLanes(frame, realDt) {
  let meanF = [0, 0];
  lanes.forEach((L, i) => {
    const r = L.run, n = r.x.length, k = Math.min(frame, n - 1), z = laneZ(i);
    const dead = r.crashed && frame >= n - 1;
    const done = frame >= n - 1;
    const g = L.drone.group;
    g.position.set(r.x[k], Math.max(r.z[k], 0.04), z);
    g.rotation.set(0, 0, r.th[k]);
    L.drone.bodyMat.color.copy(dead ? new THREE.Color(CRASH) : L.drone.baseColor);
    L.drone.bodyMat.emissive.set(dead ? '#400' : '#000');
    const a = Math.min(k, r.t0.length - 1);
    for (const rt of L.drone.rotors) {
      const f = a >= 0 ? (rt.motor === 0 ? r.t0[a] : r.t1[a]) : 0;
      rt.plume.visible = !dead;
      rt.plume.scale.y = 0.02 + f * 0.22;
      rt.plume.material.opacity = 0.08 + 0.35 * f;
      if (!dead) rt.blade.rotation.y += rt.dir * realDt * (30 + 90 * f) * (state.playing ? 1 : 0);
    }
    L.trail.visible = document.getElementById('tTrail').checked;
    L.trail.geometry.setDrawRange(0, k + 1);

    // force arrow points at the drone along the applied external force
    const fi = Math.min(k, r.fx.length - 1);
    const fx = fi >= 0 ? r.fx[fi] : 0, fz = fi >= 0 ? r.fz[fi] : 0;
    const mag = Math.hypot(fx, fz);
    meanF[0] += fx / lanes.length; meanF[1] += fz / lanes.length;
    L.arrow.visible = document.getElementById('tForce').checked && mag > 1e-3 && !done;
    if (L.arrow.visible) {
      const len = 0.2 + mag * 0.7;
      tmp.set(fx / mag, fz / mag, 0);
      L.arrow.setDirection(tmp);
      L.arrow.setLength(len, 0.07, 0.05);
      L.arrow.position.set(g.position.x - tmp.x * (len + 0.2), g.position.y - tmp.y * (len + 0.2), z);
    }

    // impulse flash
    const imp = sc.impulse_step;
    if (imp != null && frame >= imp && frame < imp + 25 && frame < n) {
      const p = (frame - imp) / 25;
      L.flash.position.copy(g.position);
      L.flash.scale.setScalar(0.08 + p * 0.5);
      L.flash.material.opacity = 0.5 * (1 - p);
    } else L.flash.material.opacity = 0;

    // status in the sidebar
    let txt, cls;
    if (dead) { txt = `crashed ${(r.steps * M.dt).toFixed(1)} s`; cls = 'bad'; }
    else if (done) { txt = `${r.success ? '✓' : '✗'} ${r.final_err.toFixed(3)} m`; cls = r.success ? 'ok' : 'bad'; }
    else { txt = `${r.err[k].toFixed(3)} m`; cls = 'fly'; }
    if (L.stEl.textContent !== txt) { L.stEl.textContent = txt; L.stEl.className = 'st ' + cls; }
  });

  if (windPts && state.playing) {
    const p = windPts.geometry.attributes.position, B = M.bounds;
    const vx = meanF[0] * 3.0, vy = meanF[1] * 3.0;
    const drift = realDt * state.speed;
    for (let k = 0; k < p.count; k++) {
      let x = p.getX(k) + vx * drift, y = p.getY(k) + vy * drift;
      const W = B.x + 1;
      if (x > W) x -= 2 * W; if (x < -W) x += 2 * W;
      if (y > B.zmax + 0.3) y -= B.zmax + 0.3; if (y < 0) y += B.zmax + 0.3;
      p.setXY(k, x, y);
    }
    p.needsUpdate = true;
  }
}

// ------------------------------------------------------------------ error chart
const chart = document.getElementById('chart');
const cctx = chart.getContext('2d');
let chartBase = null;
const PAD = { l: 44, r: 12, t: 10, b: 20 };
function chartGeom() {
  const w = chart.width, h = chart.height, dpr = devicePixelRatio;
  return { w, h, dpr, x0: PAD.l * dpr, x1: w - PAD.r * dpr, y0: PAD.t * dpr, y1: h - PAD.b * dpr };
}
function drawChartBase() {
  const r = chart.getBoundingClientRect(), dpr = devicePixelRatio;
  chart.width = Math.max(1, r.width * dpr); chart.height = Math.max(1, r.height * dpr);
  const G = chartGeom();
  chartBase = document.createElement('canvas'); chartBase.width = G.w; chartBase.height = G.h;
  const c = chartBase.getContext('2d');
  const yMax = 1.0, T = maxN;
  const X = k => G.x0 + (G.x1 - G.x0) * k / Math.max(1, T - 1);
  const Y = v => G.y1 - (G.y1 - G.y0) * Math.min(v, yMax) / yMax;
  c.font = `${11 * dpr}px system-ui, sans-serif`; c.fillStyle = '#8b95a7'; c.strokeStyle = '#262e3b'; c.lineWidth = dpr;
  for (const v of [0, 0.25, 0.5, 0.75, 1]) {
    c.beginPath(); c.moveTo(G.x0, Y(v)); c.lineTo(G.x1, Y(v)); c.stroke();
    c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(v.toFixed(2), G.x0 - 6 * dpr, Y(v));
  }
  c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText('position error [m]', G.x0 + 6 * dpr, G.y0 + 2 * dpr);
  c.textAlign = 'right';
  c.fillText(`${((T - 1) * M.dt).toFixed(0)} s`, G.x1, G.y1 + 4 * dpr);
  // success radius
  c.setLineDash([4 * dpr, 4 * dpr]); c.strokeStyle = '#3ecf8e88';
  c.beginPath(); c.moveTo(G.x0, Y(M.success_radius)); c.lineTo(G.x1, Y(M.success_radius)); c.stroke(); c.setLineDash([]);
  if (sc.impulse_step != null) {
    c.strokeStyle = '#ffffff55'; c.beginPath(); c.moveTo(X(sc.impulse_step), G.y0); c.lineTo(X(sc.impulse_step), G.y1); c.stroke();
  }
  lanes.forEach(L => {
    const e = L.run.err;
    c.strokeStyle = policyColor[L.run.policy]; c.globalAlpha = 0.75; c.lineWidth = 1.4 * dpr;
    c.beginPath();
    for (let k = 0; k < e.length; k++) k ? c.lineTo(X(k), Y(e[k])) : c.moveTo(X(k), Y(e[k]));
    c.stroke(); c.globalAlpha = 1;
    if (L.run.crashed) {
      c.fillStyle = CRASH; const k = e.length - 1;
      c.beginPath(); c.arc(X(k), Y(e[k]), 3.5 * dpr, 0, 7); c.fill();
    }
  });
}
function drawChart(frame) {
  if (!chartBase) return;
  const G = chartGeom();
  cctx.clearRect(0, 0, G.w, G.h); cctx.drawImage(chartBase, 0, 0);
  const x = G.x0 + (G.x1 - G.x0) * frame / Math.max(1, maxN - 1);
  cctx.strokeStyle = '#e6e9ef'; cctx.lineWidth = G.dpr;
  cctx.beginPath(); cctx.moveTo(x, G.y0); cctx.lineTo(x, G.y1); cctx.stroke();
}
function scrubFromChart(ev) {
  const r = chart.getBoundingClientRect();
  const f = (ev.clientX - r.left - PAD.l) / (r.width - PAD.l - PAD.r);
  state.t = Math.max(0, Math.min(1, f)) * (maxN - 1) * M.dt; state.playing = false;
}
let dragging = false;
chart.addEventListener('pointerdown', e => { dragging = true; chart.setPointerCapture(e.pointerId); scrubFromChart(e); });
chart.addEventListener('pointermove', e => dragging && scrubFromChart(e));
chart.addEventListener('pointerup', () => dragging = false);

// ------------------------------------------------------------------ controls
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
playBtn.onclick = () => { if (state.t >= (maxN - 1) * M.dt) state.t = 0; state.playing = !state.playing; };
scrub.oninput = () => { state.t = scrub.value / 1000 * (maxN - 1) * M.dt; state.playing = false; };
document.getElementById('speed').onchange = e => state.speed = +e.target.value;
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  else if (e.key === 'ArrowRight') { state.playing = false; state.t = Math.min((maxN - 1) * M.dt, state.t + M.dt); }
  else if (e.key === 'ArrowLeft') { state.playing = false; state.t = Math.max(0, state.t - M.dt); }
  else if (e.key === 'r' || e.key === 'R') { state.t = 0; state.playing = true; }
  else if (['1', '2', '3', '4'].includes(e.key)) setCamera(['oblique', 'front', 'top', 'follow'][+e.key - 1], true);
});

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  renderer.domElement.style.width = r.width + 'px'; renderer.domElement.style.height = r.height + 'px';
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
  if (sc) drawChartBase();
}
new ResizeObserver(resize).observe(view);
new ResizeObserver(() => sc && drawChartBase()).observe(chart);

// ------------------------------------------------------------------ main loop
const clock = new THREE.Clock();
function tick() {
  const realDt = Math.min(clock.getDelta(), 0.1);
  const T = (maxN - 1) * M.dt;
  if (state.playing) {
    state.t += realDt * state.speed;
    if (state.t >= T) {
      if (document.getElementById('tLoop').checked) state.t = 0;
      else { state.t = T; state.playing = false; }
    }
  }
  const frame = Math.min(maxN - 1, Math.round(state.t / M.dt));
  updateLanes(frame, realDt);
  if (state.cam === 'follow') {
    const d = lanes[state.sel].drone.group.position;
    tmp.copy(d).sub(controls.target);
    controls.target.add(tmp.multiplyScalar(0.12));
    camera.position.add(tmp);
  }
  controls.update();
  renderer.render(scene, camera);
  drawChart(frame);
  playBtn.textContent = state.playing ? '❚❚' : '▶';
  if (document.activeElement !== scrub) scrub.value = Math.round(1000 * state.t / Math.max(T, 1e-9));
  timeEl.textContent = `${state.t.toFixed(2)} / ${T.toFixed(1)} s`;
  requestAnimationFrame(tick);
}

document.getElementById('meta').textContent =
  `${M.policies.join(' vs ')} · ${M.episodes} episode${M.episodes > 1 ? 's' : ''} per policy · ${M.generated}`;
buildScenarioList();
resize();
const start = Math.max(0, DATA.scenarios.findIndex(s => '#' + s.name === location.hash));
loadScenario(start);
tick();
</script>
<script>
  // Shown if the module above fails (e.g. offline: three.js loads from a CDN).
  setTimeout(() => {
    if (!document.querySelector('#view canvas')) {
      const e = document.getElementById('err');
      e.style.display = 'grid';
      e.textContent = 'Could not start the 3D view. three.js is loaded from cdn.jsdelivr.net, so an internet connection is needed.';
    }
  }, 4000);
</script>
</body>
