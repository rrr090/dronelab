[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronelab"
version = "0.1.0"
description = "Reinforcement learning for drone teams carrying slung cargo through generated maps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dronelab = "dronelab.__main__:main"

[tool.setuptools.packages.find]
include = ["dronelab*"]

[tool.setuptools.package-data]
dronelab = ["*/viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
